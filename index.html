<style>
/* Страница выбора. Ничего, кроме трёх вариантов: решение принимается
   глазами, подписи тут только мешали бы. Номер оставлен, чтобы на
   вариант можно было сослаться в разговоре. */
:root { --bg: #17171B; --card: #1F1F25; --line: #33333D; --accent: #9BB4FF; --muted: #6E6E7A; }

* { box-sizing: border-box; }

body {
  margin: 0; min-height: 100dvh;
  background: var(--bg);
  display: grid; align-content: center;
  padding: 28px 22px;
  font: 600 13px/1.4 system-ui, -apple-system, "Segoe UI", Arial, sans-serif;
}

.grid {
  width: 100%; max-width: 1180px; margin-inline: auto;
  display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 20px;
}

.pick {
  position: relative; display: block;
  border: 1px solid var(--line); border-radius: 14px; overflow: hidden;
  background: var(--card); text-decoration: none;
  transition: border-color 200ms ease, transform 200ms ease;
}
.pick:hover, .pick:focus-visible { border-color: var(--accent); transform: translateY(-4px); }
.pick:focus-visible { outline: 2px solid var(--accent); outline-offset: 4px; }

.pick svg { display: block; width: 100%; height: auto; }

.pick b {
  position: absolute; left: 14px; top: 14px;
  width: 26px; height: 26px; border-radius: 50%;
  background: rgba(23,23,27,.72); color: #fff;
  display: grid; place-items: center;
  font-size: 12px; font-weight: 700;
  backdrop-filter: blur(6px);
}
@supports not (backdrop-filter: blur(2px)) { .pick b { background: #17171B; } }

@media (prefers-reduced-motion: reduce) { .pick { transition: border-color 200ms ease; } .pick:hover { transform: none; } }
@media (max-width: 900px) { .grid { grid-template-columns: 1fr; max-width: 520px; } }
</style>
